name: Test email to one subscriber
# Sends today's email (with that subscriber's saved business keywords) to one confirmed subscriber.
# The input is the SHA-256 of their address, so the address never appears in this public repo's logs.
run-name: Test email
on:
  workflow_dispatch:
    inputs:
      to_sha256:
        description: "SHA-256 of the subscriber's email address (lowercase)"
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - run: pip install -r requirements-scraper.txt
      - name: Send
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SITE_URL: https://floridabids.org
          API_URL: https://floridabids.weddingboca.workers.dev
          FROM_EMAIL: list@floridabids.org
        run: python -m scraper.digest --to-sha256 "${{ github.event.inputs.to_sha256 }}"
