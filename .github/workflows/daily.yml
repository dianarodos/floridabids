name: Daily bid update

on:
  schedule:
    - cron: "17 10 * * *"     # 6:17 AM Eastern (EDT); 5:17 AM in winter
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source ids to test (blank = everything)"
        required: false
        default: ""
      send_email:
        description: "Also email subscribers? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scraper.txt

      - name: Install
        run: |
          pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Read sources and build site data
        env:
          ALERTS_EMAIL: ${{ secrets.ALERTS_EMAIL }}
          ALERTS_APP_PASSWORD: ${{ secrets.ALERTS_APP_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python run.py --only "${{ github.event.inputs.only }}" 2>&1 | tee data/run_log.txt
          else
            python run.py 2>&1 | tee data/run_log.txt
          fi

      - name: Email the list to subscribers
        if: github.event_name == 'schedule' || github.event.inputs.send_email == 'yes'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SITE_URL: https://floridabids.org
          API_URL: https://floridabids.weddingboca.workers.dev
          FROM_EMAIL: list@floridabids.org
        run: python -m scraper.digest 2>&1 | tee -a data/run_log.txt

      - name: Status report to Diana (Mondays, or when something breaks)
        if: always()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          FROM_EMAIL: list@floridabids.org
        run: python -m scraper.report ${{ github.event.inputs.send_email == 'yes' && '--always' || '' }} 2>&1 | tee -a data/run_log.txt

      - name: Keep unparsed alert emails for review (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unparsed-alerts
          path: data/unparsed/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "floridabids-bot"
          git config user.email "floridabidsalerts@gmail.com"
          git add --all -- data site/data   # one missing file must not stop the others
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Daily update $(TZ=America/New_York date +'%Y-%m-%d %H:%M')"
            git push
          fi
