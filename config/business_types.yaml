# Business types a subscriber can pick. Each one expands into the words we look for in a bid's title
# (and the agency's own category). A bid matches when any term appears as a word:
#   "vehicle"  -> vehicle, vehicles          (plain term: whole word, plural s/es allowed)
#   "tint*"    -> tint, tinted, tinting      (trailing * : any word starting with it)
#   "auto parts" -> the phrase
# Free keywords typed by a subscriber are treated like "word*".
# Optional "categories": every bid the site already sorted into that category also matches.
# Add terms freely; the sign-up form and preferences page read this file (via site/data/business_types.json).

- id: food
  label: Food, catering & concessions
  terms: [food*, fruit*, vegetable*, produce, meal*, cater*, concession*, vending, beverage*, snack*, bakery,
          baked goods, kitchen*, dining, cafeteria*, coffee, dairy, milk, grocer*, nutrition*, restaurant*, ice cream,
          meat*, poultry, seafood, bread, lunch*, breakfast, culinary, food service*]

