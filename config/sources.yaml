# Every place floridabids.org gets bids from.
#
# direct:  pages the daily job reads itself (robots.txt checked on every run).
# alerts:  portals that block automated reading. We get their bids from the email alerts sent to
#          floridabidsalerts@gmail.com. `match` is text that identifies the agency in the alert email.
# skipped: shown on the site's coverage list so visitors know where to look themselves.

